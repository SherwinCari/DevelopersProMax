<style>
/* Layout: navy header with search, a full-height 3D stage on the left, a building and floor directory panel on the right (bottom sheet on phones). */
:root{
  --bg:#e9eef1; --surface:#fbfcfd; --ink:#15212c; --muted:#566471; --line:#d3dbe1; --hover:#eef2f5;
  --accent:#1b2a6b; --accent-ink:#ffffff; --gold:#e8aa00; --head:#172362; --head-ink:#ffffff;

  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --surface:#151f27; --ink:#e6edf2; --muted:#93a3af; --line:#26343f; --hover:#1c2832;
    --accent:#a8b8ff; --accent-ink:#0e1530; --head:#0b1130; --scene-bg:#131d25; --warn-bg:#3a2d08; --warn-ink:#ffd983; --hit:#3b3210;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#151f27; --ink:#e6edf2; --muted:#93a3af; --line:#26343f; --hover:#1c2832;
  --accent:#a8b8ff; --accent-ink:#0e1530; --head:#0b1130; --scene-bg:#131d25; --warn-bg:#3a2d08; --warn-ink:#ffd983; --hit:#3b3210;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{background:var(--head);color:var(--head-ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:12px 16px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12px;opacity:.75}
.search{position:relative;flex:1 1 260px;max-width:420px;min-width:0}
.search input{width:100%;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:var(--head-ink);padding:0 12px;font:inherit}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search input:focus{background:rgba(255,255,255,.2);outline:2px solid var(--gold);outline-offset:1px}
#results{position:absolute;left:0;right:0;top:46px;margin:0;padding:6px;list-style:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.28);max-height:min(60vh,420px);overflow:auto}
#results .none{padding:12px;color:var(--muted)}
.res{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px}
.res:hover,.res:focus-visible{background:var(--hover)}
.res b{display:block;font-weight:500}
.res small{color:var(--muted)}
.sw{flex:none;min-width:44px;text-align:center;color:#fff;border-radius:6px;font:600 11px/1 var(--f-mono);padding:6px 4px;letter-spacing:.02em}

.app{flex:1;min-height:0;display:flex}
.stage{position:relative;flex:1;min-width:0;background:var(--scene-bg);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.over{cursor:pointer}
#gl:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:0;border-radius:3px;color:#fff;font:600 12px/1 var(--f-display);letter-spacing:.04em;padding:7px 10px;box-shadow:0 3px 10px rgba(0,0,0,.28);white-space:nowrap;will-change:transform}
.tag:hover{filter:brightness(1.08)}
.tag.on{outline:3px solid var(--gold);outline-offset:1px;z-index:2}
.place{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:600 11px/1.15 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:#2b3a2a;text-shadow:0 0 3px rgba(255,255,255,.85),0 0 6px rgba(255,255,255,.7);will-change:transform;text-align:left}
:root[data-theme="dark"] .place{color:#dbe7d3;text-shadow:0 0 4px rgba(0,0,0,.8)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .place{color:#dbe7d3;text-shadow:0 0 4px rgba(0,0,0,.8)}}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.tools button{height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tools button:hover{background:var(--hover)}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{position:absolute;right:12px;bottom:14px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;opacity:.95;pointer-events:none;z-index:4}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:4px 8px;border-radius:6px;transform:translate(12px,12px);white-space:nowrap}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.panel{width:400px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ov{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ov h2,.dh h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.ov .lede{margin:0;color:var(--muted);max-width:60ch}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border:0;border-radius:10px;background:none;min-height:56px}
.brow:hover{background:var(--hover)}
.brow .sw{padding:11px 4px;font-size:12px}
.brow strong{display:block;font-weight:600}
.brow span.m{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fine{margin:0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:62ch}

.dh{padding:12px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:13px}
.back:hover{text-decoration:underline}
.dt{display:flex;gap:12px;align-items:center}
.dt .sw{font-size:13px;padding:9px 6px;min-width:52px}
.dm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:12.5px}
.cut{display:inline-flex;align-items:center;gap:6px;color:var(--ink);cursor:pointer}
.cut input{width:16px;height:16px;accent-color:var(--accent)}
.db{flex:1;min-height:0;display:flex}
.rail{flex:none;width:68px;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:12px 8px;border-right:1px solid var(--line)}
.rail button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--f-mono);flex:none}
.rail button:hover{background:var(--hover)}
.rail button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail button.warn{border-style:dashed}
.floor{flex:1;min-width:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.floor h3{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.2;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.floor h3 .fc{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.03em}
.wing{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.floor ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.floor li{display:flex;flex-wrap:wrap;gap:2px 10px;padding:7px 8px;border-bottom:1px solid var(--line);border-radius:6px}
.floor li:last-child{border-bottom:0}
.floor li.hit{background:var(--hit);box-shadow:inset 3px 0 0 var(--gold)}
.rm{font:600 12px/1.6 var(--f-mono);color:var(--accent);min-width:0}
.use{min-width:0;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);background:var(--hover);border-radius:8px;padding:8px 10px;margin:0}

@media (max-width:820px){
  body{overflow:hidden}
  .app{flex-direction:column}
  .panel{width:auto;flex:0 0 50%;border-left:0;border-top:1px solid var(--line)}
  .stage{flex:1 1 0;min-height:200px}
  .hint{display:none}
  .db{flex-direction:column}
  .rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .rail button{min-width:46px;height:40px}
  .brand p{display:none}
  .top{padding:10px 16px}
  .search{flex-basis:100%;max-width:none}
}
@media (prefers-reduced-motion: reduce){ .tag,.place{will-change:auto} }
</style>

/* ---------- Painting (selection, cutaway, hover) ---------- */
function paint(b){
  if(b.id==='oval'){ return; }
  const sel=state.bid===b.id?state.fi:null; const selF=sel!=null?b.floors[sel]:null;
  const cut=sel!=null&&state.cutaway&&selF&&!selF.base;
  const hov=hoverState.id===b.id;
  b.floors.forEach((f,i)=>{
    if(!f.mesh) return;
    const ghost=cut&&i>sel, hi=sel===i;
    f.mats.forEach(m=>{
      m.transparent=ghost; m.opacity=ghost?0.07:1; m.depthWrite=!ghost;
      m.color.set(hi?'#ffd466':(m.userData.base||'#ffffff'));
      m.emissive.set(hi?0x5a4200:(hov?0x16213f:0x000000));
    });
    f.mesh.castShadow=!ghost; f.mesh.userData.ghost=ghost; f.mesh.visible=true;
  });
  const rg=roofGroups[b.id]; if(rg) rg.visible=!(cut&&sel<b.topIdx);
}
function paintAll(){
  BUILDINGS.forEach(paint);
  pickables.length=0; // rebuild list of pickable meshes without ghosted floors
  scene.traverse(o=>{ if(o.isMesh&&o.userData.bid&&!o.userData.ghost&&o.visible&&(!o.parent||o.parent.visible!==false)) pickables.push(o); });
  // selection frame and marker
  const b=state.bid?byId[state.bid]:null;
  if(b){
    const {cx,cz,w,d}=b.fp, pw=w+4, pd=d+4, t=0.9; const f=selFrame.children;
    f[0].scale.set(pw,1,t); f[0].position.set(cx,0.45,cz-pd/2); f[1].scale.set(pw,1,t); f[1].position.set(cx,0.45,cz+pd/2);
    f[2].scale.set(t,1,pd); f[2].position.set(cx-pw/2,0.45,cz); f[3].scale.set(t,1,pd); f[3].position.set(cx+pw/2,0.45,cz);
    selFrame.visible=true;
    const fo=state.fi!=null?b.floors[state.fi]:null;
    if(fo){ floorMarker.geometry.dispose(); floorMarker.geometry=new THREE.EdgesGeometry(new THREE.BoxGeometry(w+0.5,fo.h+0.08,d+0.5)); floorMarker.position.set(cx,fo.y0+fo.h/2,cz); floorMarker.visible=true; }
    else floorMarker.visible=false;
  } else { selFrame.visible=false; floorMarker.visible=false; }
  tags.forEach(t=>t.el.classList.toggle('on',t.b.id===state.bid));
  renderer.shadowMap.needsUpdate=true;
}

/* ---------- Camera ---------- */
function homeView(){
  const r=stage.getBoundingClientRect(); const asp=r.width/Math.max(1,r.height);
  const rad=Math.min(680,500*(asp<1.3?Math.pow(1.3/asp,0.8):1));
  return {target:new THREE.Vector3(8,0,-6),radius:rad,theta:Math.PI/4,phi:1.0};
}
function flyTo(v,ms){
  const off=camera.position.clone().sub(controls.target), s=new THREE.Spherical().setFromVector3(off);
  let th=v.theta===undefined?s.theta:v.theta; let dth=th-s.theta; while(dth>Math.PI)dth-=2*Math.PI; while(dth<-Math.PI)dth+=2*Math.PI;
  tween={t0:performance.now(),ms:ms||900,from:{t:controls.target.clone(),r:s.radius,th:s.theta,ph:s.phi},to:{t:v.target||controls.target.clone(),r:v.radius||s.radius,th:s.theta+dth,ph:v.phi===undefined?s.phi:v.phi}};
}
function stepTween(now){
  if(!tween) return; let k=Math.min(1,(now-tween.t0)/tween.ms); const e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  controls.target.lerpVectors(tween.from.t,tween.to.t,e);
  const sp=new THREE.Spherical(tween.from.r+(tween.to.r-tween.from.r)*e,tween.from.ph+(tween.to.ph-tween.from.ph)*e,tween.from.th+(tween.to.th-tween.from.th)*e);
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sp));
  if(k>=1) tween=null;
}
function focusBuilding(b){
  const f=b.fp; flyTo({target:new THREE.Vector3(f.cx,b.focus.y,f.cz),radius:b.focus.dist,phi:Math.max(0.85,Math.min(1.1,controls.getPolarAngle()))},900);
}

/* ---------- Theme ---------- */
function isDark(){ const t=document.documentElement.getAttribute('data-theme'); if(t) return t==='dark'; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){
  if(!renderer) return; dark=isDark();
  themed.forEach(o=>o.mat.color.set(dark?o.d:o.l));
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--scene-bg').trim()||'#dfe8ee';
  scene.background=new THREE.Color(bg); scene.fog=new THREE.Fog(bg,760,1300);
  hemi.intensity=dark?0.42:0.6; sun.intensity=dark?0.5:0.62; hemi.groundColor.set(dark?0x1b2630:0xb5bd9a); sun.color.set(dark?0xbfd0ff:0xffffff);
  renderer.shadowMap.needsUpdate=true;
}
new MutationObserver(()=>setTimeout(applyTheme,0)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(applyTheme,0)); }catch(e){}

/* ---------- Loop & input ---------- */
function resize(){
  if(!renderer) return; const r=stage.getBoundingClientRect(); const w=Math.max(1,Math.floor(r.width)), h=Math.max(1,Math.floor(r.height));
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  if(!homeDone){ const v=homeView(); controls.target.copy(v.target); const sp=new THREE.Spherical(v.radius*1.5,v.phi*0.8,v.theta-0.5); camera.position.copy(v.target).add(new THREE.Vector3().setFromSpherical(sp)); homeDone=true; flyTo(v,1600); }
  else if(!userMoved&&!state.bid&&!tween){ const v=homeView(); flyTo(v,400); }
}
let hoverReq=false, lastMove=null;
function frame(now){
  requestAnimationFrame(frame); if(!renderer) return;
  stepTween(now);
  const t=controls.target; t.x=Math.max(-220,Math.min(220,t.x)); t.z=Math.max(-220,Math.min(220,t.z)); t.y=Math.max(0,Math.min(60,t.y));
  controls.update(); renderer.render(scene,camera);
  const r=stage.getBoundingClientRect(); placeLabels(r.width,r.height);
}
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pickAt(ev){
  const r=canvas.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1); raycaster.setFromCamera(ndc,camera);
  const hit=raycaster.intersectObjects(pickables,false)[0]; return hit?byId[hit.object.userData.bid]:null;
}
function setHover(b){
  const id=b?b.id:null; if(id===hoverState.id) return; const prev=hoverState.id; hoverState.id=id;
  if(prev&&byId[prev]) paint(byId[prev]); if(b) paint(b);
  canvas.classList.toggle('over',!!b); tipEl.hidden=!b; if(b) tipEl.textContent=b.name;
}
function bindInput(){
  let down=null;
  canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
  canvas.addEventListener('pointerup',e=>{ if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6&&performance.now()-down.t<500){ const b=pickAt(e); if(b) selectBuilding(b.id); } down=null; });
  canvas.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch') return; lastMove=e;
    const r=stage.getBoundingClientRect(); tipEl.style.left=(e.clientX-r.left)+'px'; tipEl.style.top=(e.clientY-r.top)+'px';
    if(hoverReq) return; hoverReq=true; requestAnimationFrame(()=>{hoverReq=false; if(lastMove&&!down) setHover(pickAt(lastMove)); });
  });
  canvas.addEventListener('pointerleave',()=>setHover(null));
  new ResizeObserver(resize).observe(stage);
  $('#bReset').addEventListener('click',()=>{ userMoved=false; if(state.bid) goOverview(); else flyTo(homeView(),900); });
  $('#bTop').addEventListener('click',()=>{ const b=state.bid?byId[state.bid]:null; flyTo({target:b?new THREE.Vector3(b.fp.cx,0,b.fp.cz):homeView().target,radius:b?b.focus.dist*1.1:homeView().radius*0.95,phi:0.18},900); });
  $('#bSpin').addEventListener('click',e=>{ controls.autoRotate=!controls.autoRotate; e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate)); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#results').hidden){closeResults();} else if(state.bid) goOverview(); } });
}

/* ---------- Selection ---------- */
function selectBuilding(id,fi,hit){
  const prev=state.bid; const b=byId[id]; if(!b) return;
  state.bid=id; state.fi=b.floors.length?(fi!=null?fi:b.firstIdx):null; state.hit=hit||null;
  if(prev&&prev!==id&&byId[prev]) paint(byId[prev]);
  paint(b); if(renderer){ paintAll(); focusBuilding(b); }
  renderPanel();
}
function selectFloor(fi,hit){ state.fi=fi; state.hit=hit||null; const b=byId[state.bid]; paint(b); if(renderer) paintAll(); renderFloor(); markRail(); }
function goOverview(){
  const prev=state.bid; state.bid=null; state.fi=null; state.hit=null; if(prev) paint(byId[prev]);
  if(renderer){ paintAll(); flyTo(homeView(),900); }
  renderPanel();
}

/* ---------- Panel ---------- */
function statusPill(t){ return t?'<span class="pill">'+esc(t)+'</span>':''; }
function renderPanel(){
  if(!state.bid){
    panelEl.innerHTML='<div class="ov"><h2>Buildings</h2><p class="lede">Pick a building here or click it on the map to see its floors, offices and rooms.</p><ul class="blist">'+
      BUILDINGS.map(b=>'<li><button class="brow" type="button" data-b="'+b.id+'"><span class="sw" style="background:'+b.color+'">'+esc(b.code)+'</span><span><strong>'+esc(b.name)+'</strong><span class="m">'+(b.floors.length?b.floors.length+' levels':'Stadium facilities')+'</span></span>'+statusPill(b.status)+'</button></li>').join('')+
      '</ul><p class="fine">Based on the official UMak campus map. Room assignments change during renovations, and some floors or buildings have restricted access or partial operations. This is a directory, not an architectural floor plan.</p></div>';
    return;
  }
  const b=byId[state.bid];
  let h='<div class="dh"><button class="back" type="button" data-back>← All buildings</button><div class="dt"><span class="sw" style="background:'+b.color+'">'+esc(b.code)+'</span><h2>'+esc(b.name)+'</h2></div><div class="dm"><span>'+(b.floors.length?b.floors.length+' levels':'Stadium facilities')+'</span>'+statusPill(b.status);
  if(b.floors.length) h+='<label class="cut"><input type="checkbox" id="cut"'+(state.cutaway?' checked':'')+'> Hide floors above</label>';
  h+='</div></div><div class="db">';
  if(b.floors.length){
    h+='<nav class="rail" aria-label="Floors of '+esc(b.name)+'">'+b.floors.map((f,i)=>'<button type="button" data-f="'+i+'" title="'+esc(f.name)+'" aria-label="'+esc(f.name)+'"'+(f.status?' class="warn"':'')+'>'+esc(f.short)+'</button>').reverse().join('')+'</nav>';
  }
  h+='<div class="floor" id="floor"></div></div>';
  panelEl.innerHTML=h; renderFloor(); markRail();
}
function renderFloor(){
  const el=$('#floor'); if(!el) return; const b=byId[state.bid];
  if(!b.floors.length){ el.innerHTML='<h3>Facilities</h3><ul>'+b.facilities.map(t=>li(t)).join('')+'</ul>'; return; }
  const f=b.floors[state.fi];
  let h='<h3>'+esc(f.name)+'<span class="fc">'+esc(f.code)+'</span></h3>'+(f.status?'<div>'+statusPill(f.status)+'</div>':'');
  f.groups.forEach(g=>{ h+='<section>'+(g.title?'<p class="wing">'+esc(g.title)+'</p>':'')+'<ul>'+g.items.map(t=>li(t)).join('')+'</ul></section>'; });
  if(f.note) h+='<p class="note">'+esc(f.note)+'</p>';
  el.innerHTML=h; el.scrollTop=0;
  const hit=el.querySelector('li.hit'); if(hit) hit.scrollIntoView({block:'nearest'});
}
function li(t){
  const i=t.indexOf(' — '); const cls=state.hit===t?' class="hit"':'';
  return i>0?'<li'+cls+'><span class="rm">'+esc(t.slice(0,i))+'</span><span class="use">'+esc(t.slice(i+3))+'</span></li>':'<li'+cls+'><span class="use">'+esc(t)+'</span></li>';
}
function markRail(){ panelEl.querySelectorAll('.rail button').forEach(btn=>{ const on=Number(btn.dataset.f)===state.fi; if(on) btn.setAttribute('aria-current','true'); else btn.removeAttribute('aria-current'); if(on) btn.scrollIntoView({block:'nearest',inline:'nearest'}); }); }
panelEl.addEventListener('click',e=>{
  const t=e.target.closest('[data-b],[data-f],[data-back]'); if(!t) return;
  if(t.hasAttribute('data-back')) goOverview(); else if(t.dataset.b) selectBuilding(t.dataset.b); else if(t.dataset.f!==undefined) selectFloor(Number(t.dataset.f));
});
panelEl.addEventListener('change',e=>{ if(e.target.id==='cut'){ state.cutaway=e.target.checked; const b=byId[state.bid]; paint(b); if(renderer) paintAll(); } });

/* ---------- Search ---------- */
const qEl=$('#q'), resEl=$('#results');
function closeResults(){ resEl.hidden=true; }
function runSearch(){
  const q=qEl.value.trim().toLowerCase(); if(!q){ closeResults(); return; }
  const toks=q.split(/\s+/); let hits=INDEX.filter(r=>toks.every(t=>r.hay.includes(t)));
  hits.sort((a,b)=>(b.text.toLowerCase().includes(q)?1:0)-(a.text.toLowerCase().includes(q)?1:0));
  hits=hits.slice(0,30);
  resEl.innerHTML=hits.length?hits.map((r,i)=>'<li><button class="res" type="button" data-i="'+INDEX.indexOf(r)+'"><span class="sw" style="background:'+r.b.color+'">'+esc(r.b.code)+'</span><span><b>'+esc(r.text)+'</b><small>'+esc(r.f?r.f.code+' · '+r.f.name:r.b.name)+(r.g.title?' · '+esc(r.g.title):'')+'</small></span></button></li>').join(''):'<li class="none">No match. Try a short word like "library" or "room 606".</li>';
  resEl.hidden=false;
}
qEl.addEventListener('input',runSearch); qEl.addEventListener('focus',runSearch);
resEl.addEventListener('click',e=>{ const bt=e.target.closest('.res'); if(!bt) return; const r=INDEX[Number(bt.dataset.i)]; closeResults(); selectBuilding(r.b.id,r.fi,r.text); });
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) closeResults(); });

/* ---------- Boot ---------- */
renderPanel();
const ok=initScene();
if(ok){ bindInput(); resize(); requestAnimationFrame(frame); }
else { $('#bReset').hidden=$('#bTop').hidden=$('#bSpin').hidden=true; document.querySelector('.hint').hidden=true; }
const h=(location.hash||'').slice(1).toLowerCase(); if(h&&byId[h]) selectBuilding(h);
window.__umap={state,selectBuilding,goOverview};
})();
</script>

</body></html>
